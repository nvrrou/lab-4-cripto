name: lab4-cripto
services:
  ssh:
    build: .
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./.local/id_ed25519.pub:/tmp/cliente.pub:ro
      - host_keys:/etc/ssh/host_keys
    healthcheck:
      test: ["CMD", "/usr/sbin/sshd", "-t"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  host_keys:
